<!DOCTYPE html>
<html lang="en">
<head>

            <div class="cont">
                <p class="crearcuenta">Crear cuenta</p>
                <form action="../../home/index.html" onsubmit= "return validar()">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"  class="">

                    <input type="password" id="contrasena" name="contrasena">
                    <label for="contrasena">Verificar contrasena:</label>

                        <input type="submit" value="Crear" class="bot" id="submit">
                    </div>
                </form>
                <p class="login">¿Ya tienes una cuenta?</p>
                <form>
                    <div class="botones"> 
                        <input type="button" value="Iniciar sesion" class="bot">
                    </div>
                </form>
