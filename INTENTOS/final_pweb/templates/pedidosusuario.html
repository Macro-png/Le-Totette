<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis pedidos</title>
    <link rel="stylesheet" href="catalogo.css">
    <script src="https://kit.fontawesome.com/56579e118f.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="pedidos.css">
</head>
<body>
        <!-- HEADER -->
    <header class="header">
        <div class="containerHeader_logo_Nav">
            <!-- LOGO -->
            <img src="../../0. img/logo minimalista.png" alt="logo_letotte   " id="header_logo">
            <!-- NAV -->
            <input type="checkbox" id="boton_abrir_menu">
            <label for="boton_abrir_menu" >
                <i class="fa-solid fa-x" id="boton_x" title="Cerrar Menú"></i>
                <i class="fa-solid fa-bars" title="Abrir Menú" id="boton_hamburguesa"></i> 
                Menú
            </label>
            <nav class="header_nav">
                <ul>
                    <li class="nav_item"><a href="../home/index.html" class="navlink">Home</a></li>
                    <li class="nav_item"><a href="../catologo/catalogo.html" class="navlink">Catálogo</a></li>
                    <li class="nav_item"><a href="../creatote/creatote.html" class="navlink">Diseña tu Totebag</a></li>
                </ul>
            </nav>
        </div>

        <!-- BUSCADOR -->
        <div class="container_buscador">
            <form class="buscador">
                <input type="text" id="buscador" placeholder="¿Qué estás buscando?">
                <i class="fa-solid fa-magnifying-glass" id="buscador_lupa"></i>
            </form>
        </div>
        <!-- BOTONES DESKTOP -->
        <div class="container_HeaderBotones">
            <a href="https://wa.link/2fr9ok"><img src="../../0. img/whats.png" alt="whatsapp" class="header_botones"></a>
            <a href="../carrito/carrito.html"><img src="../../0. img/carrito.png" alt="carrito" class="header_botones"></a>
            <a href="../Mi cuenta/miCuenta.html"><img src="../../0. img/login.png" alt="login" class="header_botones"></a>
        </div>
        <!-- BOTONES MOBILE -->
    </header>
    <div class="container_MenuBotonesMobile">
            <a href="https://wa.link/2fr9ok"><img src="../../0. img/whats.png" alt="whatsapp" class="menu_mobile_botones"></a>
            <a href="../carrito/carrito.html"><img src="../../0. img/carrito.png" alt="carrito" class="menu_mobile_botones"></a>
            <a href="../Mi cuenta/miCuenta.html"><img src="../../0. img/login.png" alt="login" class="menu_mobile_botones"></a>
    </div>
    <main>
        {%for pedido in pedidos_usuario%}
            <section>
                <div class="pedidos">
                    <ul class="producto">
                        {%for producto in pedido%}
                            <h2>{{pedido_id}}</h2>
                            <li>
                                <i class="fa-solid fa-arrow-right"></i>
                                <img class="product_img" src={{imagen_productopedido}} alt="producto_pedido"> {{nombre_productopedido}}
                                <button>
                                    <a href="../producto/producto.html">
                                        Detalles
                                    </a>
                            </button>
                            </li>
                        {%endfor%}
                    </ul>
                </div>
                <div class="estado">
                    <h2>Estado</h2>
                    <p class="espera">{{pedido_estado}}</p>
                </div>
            </section>
        {%endfor%}
    </main>
</body>
</html>
