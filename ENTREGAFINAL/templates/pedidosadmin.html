<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pedidosadmin.css') }}">
  <script src="https://kit.fontawesome.com/56579e118f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="flexbox">
<!-- navbar_admin.html -->
<!-- Mantengo tu menú lateral admin original -->

    <!-- ASIDE / MENÚ LATERAL-->
    <aside class="menu_lateral">
      <nav class="nav">
        <i class="fa-solid fa-circle-user" id="admin_icono"></i>
        <h2 id="admin">ADMIN</h2>
        <!-- checkbox oculto para responsive y label para menu-hamburguesa -->
        <input type="checkbox" id="boton_abrir_menu">
        <label for="boton_abrir_menu" class="botonmenu">
          <i class="fa-solid fa-x" id="boton_x" title="Cerrar Menú"></i>
          <i class="fa-solid fa-bars" id="boton_hamburguesa" title="Abrir Menú"></i>
          Menú
        </label>
        <!-- links -->
        <ul class="nav_list">
            <li><a href="{{ url_for('estadisticas') }}">Estadísticas</a></li>
            <li><a href="{{ url_for('pedidos_admin') }}">Pedidos</a></li>
            <li><a href="{{ url_for('add_product') }}">Producto</a></li>
        </ul>
      </nav>
    </aside>


    <main>
      <h1>Pedidos</h1>
      <section class="orders">
        {% for pedido in pedidos %}
          <article class="order" data-id="{{ pedido[0] }}">
            <h3>Pedido #{{ pedido[0] }}</h3>
            <p>Cliente: {{ pedido[1] }}</p>
            <p>Fecha: {{ pedido[2] }}</p>
            <p>Total: {{ pedido[3] }}</p>
            <p>Estado: <span class="estado-texto">{{ pedido[4] }}</span></p>
            <div>
              <form method="POST" action="{{ url_for('pedidos_admin_estado', pedido_id=pedido[0]) }}">
                <select name="estado" onchange="this.form.submit()">
                  <option value="espera" {% if pedido[4]=='espera' %}selected{% endif %}>Espera</option>
                  <option value="produccion" {% if pedido[4]=='produccion' %}selected{% endif %}>Producción</option>
                  <option value="para retirar" {% if pedido[4]=='para retirar' %}selected{% endif %}>Para retirar</option>
                  <option value="cancelado" {% if pedido[4]=='cancelado' %}selected{% endif %}>Cancelado</option>
                </select>
              </form>
            </div>
          </article>
        {% endfor %}
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/pedidosadmin.js') }}"></script>
</body>
</html>
