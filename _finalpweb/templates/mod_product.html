<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Modificar Producto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mod_product.css') }}" />
  <script src="https://kit.fontawesome.com/56579e118f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="flexbox">
    <aside class="menu_lateral">
      <nav class="nav">
        <i class="fa-solid fa-circle-user" id="admin_icono"></i>
        <h2 id="admin">ADMIN</h2>
      </nav>
    </aside>

    <main>
      <h1>Modificar Producto</h1>

      <form class="descr" id="formProducto" novalidate>
        <div>
          <label for="nombre" class="nombre">Nombre del Producto:</label>
          <input type="text" id="nombre" class="nombre" />
          <small class="error-text"></small>
        </div>
        <div>
          <label for="caract" class="caract">Características:</label>
          <textarea id="caract" class="caract"></textarea>
          <small class="error-text"></small>
        </div>
        <div class="menucolor">
          <div id="contenedor-colores">
            <div class="colores">
              <label for="color1">Código hexadecimal del color 1</label>
              <input type="text" id="color1" class="color" />
              <small class="error-text"></small>
            </div>
          </div>
          <div>
            <input type="button" value="+" id="agregarcolor" class="agregarcolor" title="Agregar color" />
          </div>
        </div>
        <div class="archivo">
          <input type="file" name="archivo" id="archivo" accept=".jpg,.jpeg,.png" />
          <small class="error-text"></small>
        </div>
        <div>
          <label for="precio">Precio</label>
          <input type="text" id="precio" class="precio" />
          <small class="error-text"></small>
        </div>
        <p id="mensaje-general" class="mensaje-general"></p>
        <div class="botones">
          <input type="submit" value="Editar producto" class="bot" />
          <input type="reset" value="Resetear" class="bot" />
        </div>
      </form>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/mod_product.js') }}"></script>
</body>
</html>
