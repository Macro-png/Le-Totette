<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pedidosadmin.css') }}">
  <script src="https://kit.fontawesome.com/56579e118f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="flexbox">
    <aside class="menu_lateral">
      <nav class="nav">
        <i class="fa-solid fa-circle-user" id="admin_icono"></i>
        <h2 id="admin">ADMIN</h2>
      </nav>
    </aside>

    <main>
      <h1>Pedidos</h1>
      <section class="orders">
        {% for pedido in pedidos %}
          <article class="order" data-id="{{ pedido[0] }}">
            <h3>Pedido #{{ pedido[0] }}</h3>
            <p>Cliente ID: {{ pedido[1] }}</p>
            <p>Fecha: {{ pedido[2] }}</p>
            <p>Total: {{ pedido[3] }}</p>
            <p>Estado: <span class="estado-texto">{{ pedido[4] }}</span></p>
            <div>
              <select class="select-estado" data-pedido="{{ pedido[0] }}">
                <option value="espera" {% if pedido[4]=='espera' %}selected{% endif %}>Espera</option>
                <option value="produccion" {% if pedido[4]=='produccion' %}selected{% endif %}>Producción</option>
                <option value="retirar" {% if pedido[4]=='retirar' %}selected{% endif %}>Para retirar</option>
                <option value="cancelado" {% if pedido[4]=='cancelado' %}selected{% endif %}>Cancelado</option>
              </select>
            </div>
          </article>
        {% endfor %}
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/pedidosadmin.js') }}"></script>
</body>
</html>
